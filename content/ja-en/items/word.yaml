# Kana section words (#45): for a kana-written word the JMdict import keeps one entry read that way
# (usually-kana and common score higher; a tie keeps the first in the file), with all its senses.
# So a homophone's entry can win (あめ: 飴 "candy" for 雨 "rain"), and the right one brings extra
# senses (ねこ: shamisen, geisha). These keep the sense the kana lesson teaches.
- key: ja:word:あお:あお
  type: word
  overrides: { senses: [{ partsOfSpeech: [n], meanings: [blue, green] }] }
- key: ja:word:あか:あか
  type: word
  overrides: { senses: [{ partsOfSpeech: [n], meanings: [red] }] }
