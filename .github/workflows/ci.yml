name: CI

# NFR-50 (strict TypeScript, linted and formatted in CI) and NFR-51 (coverage gates).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      # Real PostgreSQL for API integration tests (SDD section 13).
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: manabi
          POSTGRES_PASSWORD: manabi
          POSTGRES_DB: manabi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manabi -d manabi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://manabi:manabi@localhost:5432/manabi_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      # IF-05: packages/api-client is generated from the routes' OpenAPI document and committed.
      - name: Check the generated API client is up to date
        run: |
          npm run generate:client
          if [ -n "$(git status --porcelain -- packages/api-client)" ]; then
            git --no-pager diff -- packages/api-client
            echo "::error::packages/api-client is out of date: run 'npm run generate:client' and commit the result"
            exit 1
          fi
      - name: Check PostgreSQL is reachable
        run: psql "$DATABASE_URL" -c 'select 1'
      - name: Test with coverage
        run: npm run test:coverage
      # NFR-60, IF-03: smoke test the production build in a real browser.
      # shortcut: paused in CI to save Actions minutes (~30 s per run); run `npm run e2e --workspace
      # @manabi/web` locally before merging web changes. Remove `if: false` to turn it back on.
      - name: Install Playwright Chromium
        if: false
        run: npx playwright install --with-deps chromium
      - name: Smoke test the web app
        if: false
        run: npm run e2e --workspace @manabi/web
      # Report only by decision (#119): findings that stay are listed with a reason and review
      # date under "Dependency audit" in SDD section 11 (docs/03-software-design-document.md).
      - name: npm audit (report only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm audit --audit-level=low

  # NFR-41: release images tagged by version (v0.1.0 gives 0.1.0 and latest; a pre-release such as
  # v0.2.0-rc.1 leaves latest alone), after the check job above passes.
  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Build and push to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/jhstoops/manabi
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tags=(-t "$IMAGE:${GITHUB_REF_NAME#v}")
          [[ "$GITHUB_REF_NAME" == *-* ]] || tags+=(-t "$IMAGE:latest")
          docker build -f deploy/Dockerfile "${tags[@]}" .
          docker push --all-tags "$IMAGE"
