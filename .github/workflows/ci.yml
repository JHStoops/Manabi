name: CI

# NFR-50 (strict TypeScript, linted and formatted in CI) and NFR-51 (coverage gates).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      # Real PostgreSQL for API integration tests (SDD section 13).
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: manabi
          POSTGRES_PASSWORD: manabi
          POSTGRES_DB: manabi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manabi -d manabi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://manabi:manabi@localhost:5432/manabi_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      # FR-228, SDD section 13: file checks only. The database checks need imported datasets, so
      # they run locally in the pre-push hook (.githooks/pre-push) instead.
      - name: Content lint
        env:
          DATABASE_URL: ''
        run: npm run manabi -- pack lint content/ja-en
      # IF-05: packages/api-client is generated from the routes' OpenAPI document and committed.
      - name: Check the generated API client is up to date
        run: |
          npm run generate:client
          if [ -n "$(git status --porcelain -- packages/api-client)" ]; then
            git --no-pager diff -- packages/api-client
            echo "::error::packages/api-client is out of date: run 'npm run generate:client' and commit the result"
            exit 1
          fi
      - name: Check PostgreSQL is reachable
        run: psql "$DATABASE_URL" -c 'select 1'
      # NFR-04: initial JavaScript under 250 kB gzip.
      - name: Check the first-load bundle size
        run: |
          npm run build --workspace @manabi/web
          node apps/web/scripts/checkBundleSize.cjs
      # NFR-07: the audio tests encode and probe real clips.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Test with coverage
        run: npm run test:coverage
      # Report only by decision (#119): findings that stay are listed with a reason and review
      # date under "Dependency audit" in SDD section 11 (docs/03-software-design-document.md).
      - name: npm audit (report only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm audit --audit-level=low

  # NFR-32, NFR-60, IF-03, FR-114, FR-072: end to end in a real browser (smoke test, invite to first
  # lesson, review session, kanji drawing) against the production build and the API. Run it
  # locally with `npm run e2e --workspace @manabi/web` before merging web changes.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      # Scratch database for the end-to-end test; its contents are wiped at every start.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: manabi
          POSTGRES_PASSWORD: manabi
          POSTGRES_DB: manabi_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manabi -d manabi_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # #284: skip the suite when a change touches only documentation (docs/ and Markdown files).
      # Tags always run it, because the release job depends on this job.
      - name: Decide whether the suite needs to run
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then base="";
          elif [[ "$EVENT" == pull_request ]]; then base="$PR_BASE";
          elif [[ -n "$PUSH_BEFORE" && ! "$PUSH_BEFORE" =~ ^0+$ ]]; then base="$PUSH_BEFORE"; fi
          run=true
          if [[ -n "$base" ]] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            code=$(git diff --name-only "$base" HEAD | grep -vE '^docs/|\.md$' || true)
            if [[ -z "$code" ]]; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "End-to-end suite needed: $run"
      - uses: actions/setup-node@v5
        if: steps.changes.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.changes.outputs.run == 'true'
        run: npm ci
      - name: Install Playwright Chromium
        if: steps.changes.outputs.run == 'true'
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        if: steps.changes.outputs.run == 'true'
        env:
          E2E_DATABASE_URL: postgres://manabi:manabi@localhost:5432/manabi_e2e
        run: npm run e2e --workspace @manabi/web -- --trace off
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: apps/web/test-results
          if-no-files-found: ignore

  # NFR-41: release images tagged by version (v0.1.0 gives 0.1.0 and latest; a pre-release such as
  # v0.2.0-rc.1 leaves latest alone), after the check and e2e jobs above pass. The end-to-end suite
  # runs once, in the e2e job (#284).
  release:
    needs: [check, e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Build and push to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/jhstoops/manabi
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tags=(-t "$IMAGE:${GITHUB_REF_NAME#v}")
          [[ "$GITHUB_REF_NAME" == *-* ]] || tags+=(-t "$IMAGE:latest")
          docker build -f deploy/Dockerfile "${tags[@]}" .
          docker push --all-tags "$IMAGE"
