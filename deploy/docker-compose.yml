# Run from this folder: docker compose up -d (reads .env here)
# There is deliberately no reverse proxy here; the owner's Nginx Proxy Manager fronts the app port.
# NFR-15: only the app port is published; db and tts sit on the internal network alone.
name: manabi

x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  # Release images are built by CI on version tags (NFR-41). `docker compose build` builds one
  # locally under the same name instead.
  image: ghcr.io/jhstoops/manabi:${MANABI_VERSION:-latest}
  restart: unless-stopped
  environment: &app-env
    PUBLIC_URL: ${PUBLIC_URL}
    DATABASE_URL: ${DATABASE_URL}
    SESSION_SECRET: ${SESSION_SECRET}
    TRUST_PROXY: ${TRUST_PROXY:-1}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    LEVEL_CEILING: ${LEVEL_CEILING:-N3}
    SRS_INTERVAL_HOURS: ${SRS_INTERVAL_HOURS:-}
    MEDIA_DIR: /media
    DATASETS_DIR: /datasets
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM: ${SMTP_FROM:-}
    TZ: ${TZ:-UTC}
  volumes:
    - ${MEDIA_DIR:-./media}:/media
    # Open datasets fetched with `node dist/download.js /datasets`, read by the import commands.
    - ${DATASETS_DIR:-./datasets}:/datasets
  networks: [default, internal]
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    <<: *app
    ports:
      - '${APP_PORT:-3000}:3000'
    # FR-203: 200 when the API and database are up. The image has node but no curl.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Background and scheduled jobs (pg-boss). Study keeps working while it is stopped (NFR-23).
  # On SIGTERM it lets running jobs finish for up to 8 s, inside Compose's 10 s grace period.
  worker:
    <<: *app
    command: ['node', 'dist/worker.js']

  db:
    # postgres:17 plus tzdata-legacy (db/Dockerfile); built here, never pulled.
    build: ./db
    image: manabi-db:17
    pull_policy: build
    restart: unless-stopped
    environment:
      POSTGRES_USER: manabi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: manabi
      TZ: ${TZ:-UTC}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U manabi -d manabi']
      interval: 5s
      timeout: 5s
      retries: 10

  # Text-to-speech (Kokoro-FastAPI, spike #1), answering at http://tts:8880 on the internal network
  # only. Holds about 1.35 GB of memory. Study keeps working while it is stopped (device voices).
  tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.10.0@sha256:f54c5960c2b9387f6349080a9944f8bc7e8cdb98a4ef9238cb0b0f9ff9795f44
    restart: unless-stopped
    environment:
      # Set to the LXC's vCPU count; Kokoro otherwise sizes its threads from the host's cores.
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
    networks: [internal]

  # Nightly pg_dump into DUMPS_DIR, keeping 14 days. Back that folder up with Backrest/restic.
  backup:
    image: postgres:17
    restart: unless-stopped
    entrypoint: ['/bin/bash', '/dump.sh', '--loop']
    environment:
      PGHOST: db
      PGUSER: manabi
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: manabi
      DUMP_DIR: /dumps
      KEEP_DAYS: '14'
      TZ: ${TZ:-UTC}
    volumes:
      - ./backup/dump.sh:/dump.sh:ro
      - ${DUMPS_DIR:-./dumps}:/dumps
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

networks:
  # No route in or out of the Docker host; only app and worker also join the default network.
  internal:
    internal: true
